<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#5e35b1">
    <title>우리 아이 주간 루틴표 (태블릿 버전)</title>
    <style>
        /* 기본 리셋 및 최적화 */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; 
            background: linear-gradient(135deg, #e3f2fd 0%, #e1bee7 100%); 
            min-height: 100vh; 
            padding: 20px; 
            padding-bottom: 60px; 
            color: #333;
        }
        
        /* 태블릿용 메인 컨테이너 (너비 확대) */
        .container { 
            max-width: 1024px; 
            margin: 0 auto; 
            position: relative; 
        }

        /* 메인 헤더 카드 */
        .header-card {
            background: white; 
            border-radius: 20px; 
            padding: 20px 24px; 
            margin-bottom: 20px; 
            box-shadow: 0 4px 16px rgba(0,0,0,0.06); 
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header-info h1 { font-size: 24px; color: #333; margin-bottom: 4px; }
        .header-info .subtitle { color: #666; font-size: 14px; }
        
        /* 필터 버튼 */
        .filter-container { display: flex; gap: 8px; }
        .filter-btn { 
            padding: 10px 18px; 
            border: 2px solid #5e35b1; 
            border-radius: 12px; 
            background: white; 
            color: #5e35b1; 
            font-weight: bold; 
            font-size: 14px; 
            cursor: pointer; 
            transition: all 0.2s ease;
        }
        .filter-btn.active { background: #5e35b1; color: white; }

        /* [추가] 상단 탭 (루틴표 / 영어 수업노트) */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn {
            flex: 1; padding: 14px; border: none; border-radius: 16px;
            background: rgba(255,255,255,0.65); color: #5e35b1;
            font-size: 16px; font-weight: 700; cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }
        .tab-btn.active { background: #5e35b1; color: white; }
        @media (max-width: 480px) { .tab-btn { font-size: 14px; padding: 12px 4px; } }

        /* 태블릿용 2열 대시보드 레이아웃 */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1.25fr 0.95fr; /* 좌측(루틴):우측(주말/기록) 비율 */
                align-items: start;
            }
        }
        
        /* 카드 공통 */
        .card { 
            background: white; 
            border-radius: 20px; 
            padding: 20px; 
            margin-bottom: 16px; 
            box-shadow: 0 4px 16px rgba(0,0,0,0.06); 
        }
        h2 { font-size: 18px; color: #333; margin-bottom: 14px; }
        
        /* 섹션 헤더 */
        .section-header { 
            display: inline-block; 
            padding: 8px 16px; 
            border-radius: 10px; 
            font-weight: 700; 
            font-size: 14px; 
            margin-bottom: 12px; 
            margin-top: 4px; 
        }
        .morning { background: #fff9c4; color: #f57f17; }
        .afternoon { background: #ffe0b2; color: #e65100; }
        
        /* 루틴 카드 */
        .routine-card { background: #f8f9fa; border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; border: 1px solid #eef0f2; }
        .routine-card.group-talk { background: #ece4fa; border: 1px solid #b39ddb; border-left: 5px solid #7e57c2; }
        .routine-card.group-eng2 { background: #dff3e4; border: 1px solid #a5d6a7; border-left: 5px solid #43a047; }
        .routine-card.group-eng { background: #d6ebff; border: 1px solid #90caf9; border-left: 5px solid #1e88e5; }
        .routine-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .routine-emoji { font-size: 22px; }
        .routine-name { font-size: 15px; font-weight: 700; color: #333; }
        .days-note { font-size: 12px; color: #777; font-weight: 600; }
        .effort-guide { font-size: 12px; color: #ff6f00; font-weight: 600; margin-left: 30px; margin-bottom: 4px; }
        .routine-trigger { font-size: 12px; color: #666; font-style: italic; margin-bottom: 4px; margin-left: 30px; }
        .routine-note { font-size: 12px; color: #555; margin-left: 30px; margin-bottom: 10px; line-height: 1.4; }
        
        /* 요일 버튼 그리드 */
        .days-grid { display: grid; gap: 6px; margin-top: 8px; }
        .days-grid.seven-days { grid-template-columns: repeat(7, 1fr); }
        .days-grid.six-days { grid-template-columns: repeat(6, 1fr); }
        .days-grid.five-days { grid-template-columns: repeat(5, 1fr); }
        .days-grid.four-days { grid-template-columns: repeat(4, 1fr); }
        .days-grid.three-days { grid-template-columns: repeat(3, 1fr); }
        .days-grid.weekend-only { grid-template-columns: repeat(2, 1fr); }
        
        .day-box { display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .day-label { font-size: 12px; color: #777; font-weight: 600; }
        .day-btn { 
            width: 100%; 
            height: 44px; 
            border: 1.5px solid #dcdfe6; 
            border-radius: 10px; 
            background: white; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            transition: transform 0.1s ease;
        }
        .day-btn:active { transform: scale(0.96); }
        .day-btn.checked { background-color: #2e7d32 !important; border-color: #1b5e20 !important; }
        .day-btn.circle { background-color: #ff8f00 !important; border-color: #ff6f00 !important; }
        .day-btn.sick { background-color: #5c6bc0 !important; border-color: #3949ab !important; font-size: 18px; }
        .day-btn.off { background: #eee; border-color: #ddd; color: #ccc; cursor: not-allowed; font-size: 11px; }
        
        /* 아이콘 크기 최적화 */
        .checkmark { width: 22px; height: 22px; stroke: white; stroke-width: 4; fill: none; }
        .circle-icon { width: 16px; height: 16px; border: 4px solid white; border-radius: 50%; }
        
        /* 폭죽 모션 */
        .confetti { position: fixed; width: 8px; height: 8px; z-index: 1001; top: -10px; border-radius: 2px; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(100vh) rotate(720deg); } }
        
        /* 주말 섹션 */
        .weekend-wrapper { display: flex; flex-direction: column; gap: 12px; }
        .activity-btn { 
            width: 100%; 
            padding: 12px 14px; 
            margin-bottom: 8px; 
            border: 1.5px solid #e0e0e0; 
            border-radius: 10px; 
            background: white; 
            text-align: left; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 14px;
            transition: all 0.2s ease;
        }
        .activity-btn.selected { background: #ec407a; color: white; border-color: #ec407a; }
        
        /* 성장 기록 및 입력창 */
        .badge-container { display: flex; flex-direction: column; align-items: center; padding: 16px; background: #f1f8e9; border-radius: 12px; margin-bottom: 14px; border: 1px dashed #81c784; }
        .badge-icon { font-size: 42px; margin-bottom: 4px; }
        .badge-text { font-size: 14px; font-weight: bold; color: #2e7d32; }
        
        label { font-size: 13px; font-weight: bold; color: #555; display: block; margin-top: 10px; margin-bottom: 4px; }
        input[type="text"] { width: 100%; padding: 12px; border: 1.5px solid #e0e0e0; border-radius: 10px; font-size: 14px; margin-bottom: 6px; }
        input[type="text"]:focus { border-color: #5e35b1; outline: none; }

        /* 버튼 영역 */
        .btn-group { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .save-btn { width: 100%; padding: 13px; background: #4caf50; color: white; border: none; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; transition: background 0.2s ease; }
        .save-btn:hover { background: #43a047; }
        .email-btn { background: #2196f3; }
        .email-btn:hover { background: #1e88e5; }
        .reset-btn { background: none; border: none; color: #888; text-decoration: underline; font-size: 12px; width: 100%; cursor: pointer; margin-top: 12px; padding: 4px; }
        
        /* 팝업 모달 */
        .popup { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.85); color: white; padding: 16px 28px; border-radius: 30px; display: none; z-index: 2000; text-align: center; font-weight: bold; font-size: 15px; border: 1px solid #fff; width: 80%; max-width: 360px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .day-box.is-today .day-label { color: #5e35b1; font-weight: bold; text-decoration: underline; }

        /* [추가] 영어 수업노트 */
        #notesView { max-width: 640px; margin: 0 auto; }
        .notes-count { text-align: right; color: #666; font-size: 14px; margin-bottom: 10px; font-weight: 600; }
        .lesson { background: white; border-radius: 20px; margin-bottom: 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); overflow: hidden; }
        .lesson summary { list-style: none; cursor: pointer; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
        .lesson summary::-webkit-details-marker { display: none; }
        .lesson summary b { font-size: 18px; color: #333; display: block; }
        .lesson summary small { color: #777; font-size: 13px; }
        .lesson-body { padding: 0 20px 20px; }
        .lesson-book { font-size: 13px; color: #777; margin-bottom: 4px; }
        .lesson-body h3 { font-size: 16px; color: #5e35b1; margin: 18px 0 8px; }
        .pat { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 0; border-top: 1px dashed #e0e0e0; font-size: 17px; line-height: 1.5; }
        .pat:first-of-type { border-top: none; }
        .pat.done .pat-text { color: #2e7d32; }
        .pat-text { flex: 1; }
        .pat-check { display: flex; align-items: center; gap: 6px; margin: 0; font-size: 13px; color: #777; white-space: nowrap; }
        .pat-check input { width: 22px; height: 22px; accent-color: #2e7d32; }
        /* [추가] 이번 주 복습 */
        .review { background: white; border-radius: 20px; padding: 20px; margin-bottom: 22px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); border-left: 5px solid #7e57c2; }
        .review h2 { margin-bottom: 2px; }
        .review .sub { font-size: 13px; color: #777; margin-bottom: 6px; }
        .step-t { font-size: 16px; font-weight: 700; color: #5e35b1; margin: 18px 0 6px; display: flex; justify-content: space-between; }
        .step-t small { color: #777; font-weight: 600; font-size: 13px; }
        .wk-day { font-size: 13px; font-weight: 700; color: #7e57c2; margin-top: 8px; }
        .notes-h { font-size: 17px; margin: 6px 0 12px; color: #333; }
        .q-meta { font-size: 13px; color: #777; }
        .q-was { margin: 8px 0 4px; font-size: 18px; font-weight: 600; color: #666; line-height: 1.5; }
        .q-was .was { color: #707070; text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: #e53935; }
        .q-ask { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
        .q-ans { min-height: 68px; border: 2px dashed #b39ddb; border-radius: 14px; padding: 6px; margin: 10px 0; display: flex; flex-wrap: wrap; align-items: center; background: #fff; }
        .q-ans.good { border: 2px solid #2e7d32; background: #e8f5e9; }
        .q-ans.bad { border: 2px solid #e53935; animation: shake 0.4s; }
        @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
        .q-pool { display: flex; flex-wrap: wrap; }
        .tile { font-size: 18px; font-weight: 600; padding: 10px 14px; margin: 4px; border-radius: 12px; border: 2px solid #b39ddb; background: #f3eefb; color: #333; cursor: pointer; }
        .q-ans .tile { background: #fff; }
        .q-ok { color: #2e7d32; font-weight: 700; margin: 6px 0; }
        .q-no { color: #e53935; font-size: 14px; margin: 6px 0; }
        .mini { padding: 9px 16px; border-radius: 999px; border: 2px solid #5e35b1; background: #fff; color: #5e35b1; font-weight: 700; font-size: 14px; cursor: pointer; margin: 6px 6px 0 0; }
        .mini.go { background: #5e35b1; color: #fff; }
        .fix { background: #f3eefb; border-radius: 12px; padding: 10px 14px; margin-bottom: 8px; line-height: 1.5; }
        .fix .was { color: #888; text-decoration: line-through; text-decoration-color: #e53935; font-size: 14px; }
        .fix .now { color: #2e7d32; font-weight: 700; font-size: 16px; }
    </style>
</head>
<body>
    <div id="popup" class="popup"></div>
    
    <div class="container">
        <!-- 상단 헤더 -->
        <div class="header-card">
            <div class="header-info">
                <h1>⭐ 우리 아이 주간 루틴표</h1>
                <div class="subtitle">"오늘의 작은 발걸음이 내일의 큰 꿈이 될 거야!"</div>
            </div>
            <div class="filter-container" id="filterBox">
                <button id="viewAll" class="filter-btn active" onclick="setFilter('all')">전체 루틴</button>
                <button id="viewToday" class="filter-btn" onclick="setFilter('today')">오늘만 집중</button>
            </div>
        </div>

        <!-- [추가] 탭 -->
        <div class="tabs">
            <button id="tabRoutine" class="tab-btn active" onclick="showTab('routine')">📅 루틴표</button>
            <button id="tabNotes" class="tab-btn" onclick="showTab('notes')">📖 영어 수업노트</button>
            <button id="tabReview" class="tab-btn" onclick="showTab('review')">🎯 이번 주 복습</button>
        </div>

        <!-- 루틴표 화면 (기존 내용 전체를 이 div 안에 넣었어요) -->
        <div id="routineView">
        <!-- 대시보드 2열 레이아웃 -->
        <div class="dashboard-grid">
            <!-- 좌측: 아침 & 오후 루틴 -->
            <div id="routineContainer">
                <div class="section-header morning">🌅 아침 루틴</div>
                <div id="morningRoutines"></div>
                
                <div class="section-header afternoon">☀️ 오후 루틴</div>
                <div id="afternoonRoutines"></div>
            </div>

            <!-- 우측: 주말 활동 & 성찰 기록 -->
            <div class="right-sidebar">
                <div class="weekend-wrapper" id="weekendSection">
                    <div class="card" style="border-left: 5px solid #ec407a;">
                        <h2>✨ 주말 특별 활동</h2>
                        <div id="saturdayActivities"></div>
                        <label for="weekendWish">💭 우리 아이 희망사항</label>
                        <input type="text" id="weekendWish" placeholder="예: 키즈카페 가고 싶어요" oninput="data.weekendWish = this.value; save();">
                    </div>
                </div>

                <div class="card" style="border-left: 5px solid #4caf50;">
                    <h2>💭 이번 주 성장 기록</h2>
                    <div class="badge-container" id="badgeArea">
                        <div class="badge-icon" id="badgeIcon">🌱</div>
                        <div class="badge-text" id="badgeText">씨앗이 심어졌어!</div>
                    </div>
                    <label>제일 쉬웠던 것:</label>
                    <input type="text" id="weeklyEasy" placeholder="예: 아침 독서하기">
                    
                    <label>힘들었던 것:</label>
                    <input type="text" id="weeklyHard" placeholder="예: 한자 공부하기">
                    
                    <label>다음 주 작전:</label>
                    <input type="text" id="weeklyPlan" placeholder="예: 저녁 먹고 바로 공부 시작!">
                    
                    <div class="btn-group">
                        <button class="save-btn" onclick="saveReflection()">기록 저장하기</button>
                        <button class="save-btn email-btn" onclick="sendWeeklyEmail()">📧 기록 메일 보내기</button>
                    </div>
                    <button class="reset-btn" onclick="manualResetRoutines()">🔄 새로운 주 시작 (전체 초기화)</button>
                </div>
            </div>
        </div>
        </div>

        <!-- [추가] 영어 수업노트 화면 -->
        <div id="notesView" style="display:none">
            <div class="notes-count" id="notesCount"></div>
            <div id="lessonList"></div>
        </div>

        <!-- [추가] 이번 주 복습 화면 -->
        <div id="reviewView" style="display:none">
            <div id="weekReview"></div>
        </div>
    </div>

    <script>
        const weekdayList = ['월', '화', '수', '목', '금'];
        const fullWeekList = ['월', '화', '수', '목', '금', '토', '일'];
        const sixDayList = ['월', '화', '수', '목', '금', '주말'];
        const weekendList = ['토', '일'];
        const hanjaList = ['월', '수', '목'];

        const todayIdx = (new Date().getDay() + 6) % 7;
        const todayName = fullWeekList[todayIdx];
        const todayLabel = todayIdx >= 5 ? '주말' : todayName;

        const routineData = {
            morning: [
                { id: 'english', group: 'eng', name: '영어도서관 30분', emoji: '📚', trigger: '아침밥 먹으면서', effort: '집중해서 10분만 들어도 OK!', allowSick: true },
                { id: 'english_read_along', group: 'eng', name: '영어 따라 읽기', emoji: '🗣️', weekdayOnly: true, allowSick: true },
                { id: 'talkstation', group: 'talk', name: '토크스테이션 과제하기', emoji: '🎤', customDays: ['1회', '2회'], activeDays: ['화', '목', '금'], daysNote: '화/목/금', allowSick: true },
                { id: 'notes_check', group: 'talk', name: '영어수업노트 체크+주말 복습', emoji: '📓', customDays: ['화', '목', '주말'], isSixDay: true, allowSick: true }
            ],
            afternoon: [
                { id: 'math_all', name: '수학공부(핀란드수학/학교수학)', emoji: '🔢', isSixDay: true, allowSick: true },
                { id: 'english_listening', group: 'eng2', name: '영어책 집중듣기', emoji: '🎧', instruction: '오늘 읽은 책에서 제일 마음에 드는 문장 하나만 적어줘', isSixDay: true, allowSick: true },
                { id: 'english_write_sentence', group: 'eng2', name: '마음에 드는 문장 따라 쓰기', emoji: '✏️', isSixDay: true, allowSick: true },
                { id: 'hanja', name: '한자 학습', emoji: '✍️', customDays: ['1회', '2회', '3회'], activeDays: ['월', '수', '금', '주말'], daysNote: '월/수/금/주말', isSixDay: true, instruction: '학습지? 한자어책?', allowSick: true },
                { id: 'reading_combined', name: '독서 시간', emoji: '📖', trigger: '읽고 싶은 책 자유롭게 꺼내기', weekendEnabled: true, allowSick: true },
                { id: 'ringfit', name: '운동 (러닝/링핏)', emoji: '🏃', trigger: '식후 한 시간 뒤', weekendEnabled: true, allowSick: true }
            ]
        };

        const satItems = ['보드게임 1판', '물감 그림 그리기', '만들기 활동', '도서관 방문', '가족 예능 보기'];
        
        const readingMsgs = ["책 속의 보물을 찾았구나! 💎", "생각의 주머니가 한 뼘 더 커졌네! 🎈", "멋진 독서가! 오늘 정말 훌륭해 📖"];
        const normalMsgs = ["대단해! 해냈구나! 🌟", "멋져! 끝까지 해냈어 👍", "최고야! 기분이 좋지? 😊"];
        const sickMsg = ["오늘은 푹 쉬고 빨리 나으자! 💊", "충분한 휴식도 성장의 일부야 🛌"];

        /* ============================================================
           [추가] 영어 수업노트 데이터
           수업이 끝나면 아래 lessons 안에 { ... } 한 덩어리를 추가하면 돼요.
           (날짜 date 기준으로 최신 수업이 자동으로 맨 위에 나와요)
           ============================================================ */
        const lessons = [
            {
                date: '2026-09-30', label: '9월 30일 수요일', time: '14:30~14:54', teacher: 'Nicole',
                book: 'GL3 - The Three Axes (Finish)',
                pron: '',   /* 발음 교정이 있으면 여기에 적기. 비워두면 "고칠 발음 없음" 표시 */
                fixes: [
                    ['a very short pencil.', 'I have a very short pencil that I really like for a long time.'],
                    ['smell and story', 'I like the smell of old things and the story behind them.']
                ],
                patterns: [
                    'My old sketchbook is very old and I like old things.',
                    'I think he will use the axe for chopping trees.',
                    "I think he'll buy fruits and maybe buy a house.",
                    'Do you think he did the right thing?',
                    "Yes, I do. It's because he helped other people.",
                    'I will buy food and help others.'
                ]
            },
            {
                date: '2026-09-28', label: '9월 28일 월요일', time: '14:30', teacher: 'Nicole',
                book: 'The Three Axes',
                pron: '',
                fixes: [
                    ['chopping trees.', 'An axe is used for chopping trees.'],
                    ["I think the mountain god will got the man's axe back.", "I think the mountain god will get the man's axe back."]
                ],
                patterns: [
                    'What do you think the poor man will do?',
                    'I think he wanted his axe back.',
                    'He will jump into the lake.',
                    'No, because I like the old axe more than the gold one.'
                ]
            }
        ];

        let data = JSON.parse(localStorage.getItem('routineData')) || { routines: {}, weekend: [], bridge: '', weekly: {} };
        let currentFilter = 'all';
        /* 수업노트 "읽었어요" 기록은 주간 초기화에 지워지지 않도록 따로 저장 */
        let notesDone = {};
        try { notesDone = JSON.parse(localStorage.getItem('notesDone')) || {}; } catch (e) {}

        function createConfetti() {
            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 70%, 60%)`;
                confetti.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 2500);
            }
        }

        function toggle(id, d, allowSick) {
            const key = id + '-' + d;
            const s = data.routines[key] || 'empty';
            if (s === 'empty') data.routines[key] = 'checked';
            else if (s === 'checked') data.routines[key] = 'circle';
            else if (s === 'circle' && allowSick) data.routines[key] = 'sick';
            else data.routines[key] = 'empty';
            
            if(data.routines[key] !== 'empty') {
                createConfetti();
                let msgs = data.routines[key] === 'sick' ? sickMsg : (id.includes('reading') ? readingMsgs : normalMsgs);
                showPopup(msgs[Math.floor(Math.random() * msgs.length)]);
            }
            save(); render();
        }

        function save() { localStorage.setItem('routineData', JSON.stringify(data)); }
        function showPopup(m) { const p = document.getElementById('popup'); p.textContent = m; p.style.display = 'block'; setTimeout(() => p.style.display = 'none', 1800); }

        function createCard(r) {
            let days = r.customDays ? r.customDays : (r.weekendEnabled ? fullWeekList : (r.weekdayOnly ? weekdayList : (r.weekendOnly ? weekendList : (r.isSixDay ? sixDayList : weekdayList))));
            let currentCheckLabel = r.isSixDay ? todayLabel : todayName;
            if (currentFilter === 'today' && !(r.activeDays || days).includes(currentCheckLabel)) return '';
            
            let dHtml = '';
            let displayDays = (currentFilter === 'today' && !r.activeDays) ? [currentCheckLabel] : days;

            displayDays.forEach((d) => {
                const state = data.routines[r.id + '-' + d] || 'empty';
                const isOff = r.offDays?.includes(fullWeekList.indexOf(d));
                dHtml += `<div class="day-box ${d === currentCheckLabel ? 'is-today' : ''}">
                    <div class="day-label">${d}</div>
                    <button class="day-btn ${isOff ? 'off' : state}" ${isOff ? 'disabled' : `onclick="toggle('${r.id}','${d}',${r.allowSick})"`}>
                        ${state === 'checked' ? '<svg class="checkmark" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>' : state === 'circle' ? '<div class="circle-icon"></div>' : state === 'sick' ? '🤒' : (isOff ? 'OFF' : '')}
                    </button>
                </div>`;
            });

            if (currentFilter === 'today' && !r.isSixDay && r.offDays?.includes(todayIdx)) return '';

            let gridClass = (currentFilter === 'today' && !r.activeDays) ? '' : (days.length === 7 ? 'seven-days' : (days.length === 6 ? 'six-days' : (days.length === 4 ? 'four-days' : (days.length === 3 ? 'three-days' : (days.length === 2 ? 'weekend-only' : 'five-days')))));

            return `<div class="routine-card ${r.group ? 'group-' + r.group : ''}">
                <div class="routine-header">
                    <span class="routine-emoji">${r.emoji}</span>
                    <span class="routine-name">${r.name}</span>${r.daysNote ? `<span class="days-note">${r.daysNote}</span>` : ''}
                </div>
                ${r.effort ? `<div class="effort-guide">⭕ ${r.effort}</div>` : ''}
                ${r.trigger ? `<div class="routine-trigger">⏰ ${r.trigger}</div>` : ''}
                ${r.instruction ? `<div class="routine-note">💡 ${r.instruction}</div>` : ''}
                <div class="days-grid ${gridClass}">${dHtml}</div>
            </div>`;
        }

        function updateBadge() {
            const count = Object.values(data.routines).filter(v => v !== 'empty').length;
            const icon = document.getElementById('badgeIcon'); const text = document.getElementById('badgeText');
            if (count < 8) { icon.textContent = '🌿'; text.textContent = '새싹이 올라왔어! 대단해!'; }
            else if (count < 20) { icon.textContent = '🌳'; text.textContent = '우와, 튼튼한 나무가 되었어!'; }
            else { icon.textContent = '🍎'; text.textContent = '축하해! 황금 열매가 열렸어!'; }
        }

        function sendWeeklyEmail() {
            let greenCount = 0; let yellowCount = 0; let sickCount = 0;
            Object.values(data.routines).forEach(s => { 
                if(s === 'checked') greenCount++; 
                if(s === 'circle') yellowCount++;
                if(s === 'sick') sickCount++;
            });
            const body = `이번 주 루틴 결과입니다!\n\n✅ 초록 체크: ${greenCount}개\n⭕ 노란 동그라미: ${yellowCount}개\n🤒 아파요: ${sickCount}개\n\n💭 한 마디:\n쉬웠던 것: ${data.weekly.easy || '-'}\n힘들었던 것: ${data.weekly.hard || '-'}\n내일 작전: ${data.weekly.plan || '-'}`;
            window.location.href = `mailto:?subject=[루틴표] 이번 주 기록&body=${encodeURIComponent(body)}`;
        }

        function manualResetRoutines() {
            if (confirm('⚠️ 이번 주 기록을 모두 초기화할까요?')) {
                data = { routines: {}, weekend: [], bridge: '', weekly: {} };
                save(); render(); alert('초기화 완료! 새로운 한 주 화이팅! 🌟');
            }
        }

        function setFilter(f) { 
            currentFilter = f; 
            document.getElementById('viewAll').classList.toggle('active', f === 'all'); 
            document.getElementById('viewToday').classList.toggle('active', f === 'today'); 
            const isWeekend = todayIdx >= 5; 
            document.getElementById('weekendSection').style.display = (f === 'today' && !isWeekend) ? 'none' : 'flex'; 
            render(); 
        }

        function toggleSat(a) { const i = data.weekend.indexOf(a); if(i > -1) data.weekend.splice(i, 1); else if(data.weekend.length < 2) { data.weekend.push(a); createConfetti(); } save(); render(); }
        function saveReflection() { data.weekly = { easy: document.getElementById('weeklyEasy').value, hard: document.getElementById('weeklyHard').value, plan: document.getElementById('weeklyPlan').value }; save(); alert('저장 완료!'); }

        /* [추가] 탭 전환 */
        function showTab(t) {
            const n = t === 'notes', r = t === 'review';
            document.getElementById('routineView').style.display = (n || r) ? 'none' : 'block';
            document.getElementById('notesView').style.display = n ? 'block' : 'none';
            document.getElementById('reviewView').style.display = r ? 'block' : 'none';
            document.getElementById('filterBox').style.display = (n || r) ? 'none' : 'flex';
            document.getElementById('tabRoutine').classList.toggle('active', !n && !r);
            document.getElementById('tabNotes').classList.toggle('active', n);
            document.getElementById('tabReview').classList.toggle('active', r);
            if (n) renderNotes();
            if (r) renderWeekReview();
        }

        /* [추가] 영어 수업노트 */
        function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
        function updateNotesCount() {
            let total = 0, read = 0;
            lessons.forEach(l => l.patterns.forEach((p, j) => { total++; if (notesDone[l.date + '-' + j]) read++; }));
            document.getElementById('notesCount').textContent = '읽은 문장 ' + read + ' / ' + total;
            updateWkCount();
        }
        function saveNotes() { try { localStorage.setItem('notesDone', JSON.stringify(notesDone)); } catch (e) {} }
        function toggleNote(key, checked) {
            notesDone[key] = checked; saveNotes();
            /* 이번 주 복습 영역과 수업 카드에 같은 문장이 있으면 함께 체크 */
            document.querySelectorAll('input[data-key="' + key + '"]').forEach(i => {
                i.checked = checked; i.closest('.pat').classList.toggle('done', checked);
            });
            if (checked) createConfetti();
            updateNotesCount();
        }
        function renderNotes() {
            const sorted = [...lessons].sort((a, b) => b.date.localeCompare(a.date));
            document.getElementById('lessonList').innerHTML = sorted.map((l, i) => `
                <details class="lesson" ${i === 0 ? 'open' : ''}>
                    <summary><span><b>${esc(l.label)}</b><small>Teacher ${esc(l.teacher)} · ${esc(l.time)}</small></span><span aria-hidden="true">▾</span></summary>
                    <div class="lesson-body">
                        <div class="lesson-book">📖 ${esc(l.book)}</div>
                        <h3>🗣️ 오늘 배운 말</h3>
                        ${l.patterns.map((p, j) => {
                            const key = l.date + '-' + j;
                            return `<div class="pat ${notesDone[key] ? 'done' : ''}">
                                <div class="pat-text">${esc(p)}</div>
                                <label class="pat-check"><input type="checkbox" ${notesDone[key] ? 'checked' : ''} data-key="${key}" onchange="toggleNote('${key}', this.checked)">읽었어요</label>
                            </div>`;
                        }).join('')}
                        <h3>✏️ 이렇게 말하면 더 좋아요</h3>
                        ${l.fixes.map(f => `<div class="fix"><div class="was">${esc(f[0])}</div><div class="now">${esc(f[1])}</div></div>`).join('')}
                        <h3>🎧 발음</h3>
                        <p>${l.pron ? esc(l.pron) : '고칠 발음이 없었어요. 잘했어요! 🎉'}</p>
                    </div>
                </details>`).join('');
            updateNotesCount();
        }

        /* [추가] 이번 주 복습: 가장 최근 수업이 있는 주의 수업들을 합쳐서 복습 */
        const ymd = d => d.split('-').map(Number);
        const dayK = d => { const [y, m, dd] = ymd(d); return '일월화수목금토'[new Date(y, m - 1, dd).getDay()]; };
        const mdTxt = d => { const [, m, dd] = ymd(d); return m + '/' + dd; };
        function weekKey(d) { const [y, m, dd] = ymd(d); const t = new Date(y, m - 1, dd); t.setDate(t.getDate() - ((t.getDay() + 6) % 7)); return t.getFullYear() + '-' + (t.getMonth() + 1) + '-' + t.getDate(); }
        function weekLessons() {
            if (!lessons.length) return [];
            const latest = [...lessons].sort((a, b) => b.date.localeCompare(a.date))[0];
            return lessons.filter(l => weekKey(l.date) === weekKey(latest.date)).sort((a, b) => a.date.localeCompare(b.date));
        }
        function updateWkCount() {
            const el = document.getElementById('wkCount'); if (!el) return;
            let t = 0, r = 0;
            weekLessons().forEach(l => l.patterns.forEach((p, j) => { t++; if (notesDone[l.date + '-' + j]) r++; }));
            el.textContent = r + ' / ' + t;
        }

        /* 고친 문장 퀴즈 (단어 카드 재조합) */
        let Q = { sig: '', items: [], i: 0, toks: [], order: [], ans: [], celebrated: false };
        function qItems() {
            const out = [];
            weekLessons().forEach(l => l.fixes.forEach((f, k) => out.push({ key: 'q:' + l.date + '-' + k, was: f[0], now: f[1] })));
            return out;
        }
        function qStart(i) {
            Q.i = i; Q.celebrated = false; Q.ans = [];
            Q.toks = Q.items[i].now.split(' ');
            let o = Q.toks.map((_, x) => x);
            for (let t = 0; t < 8; t++) { o.sort(() => Math.random() - 0.5); if (o.map(x => Q.toks[x]).join(' ') !== Q.items[i].now) break; }
            Q.order = o;
            renderQuiz();
        }
        function qCheck() {
            const it = Q.items[Q.i];
            if (Q.ans.length === Q.toks.length && Q.ans.map(id => Q.toks[id]).join(' ') === it.now && !Q.celebrated) {
                Q.celebrated = true; notesDone[it.key] = true; saveNotes(); createConfetti();
            }
        }
        function qPick(id) { Q.ans.push(id); qCheck(); renderQuiz(); }
        function qBack(id) { Q.ans = Q.ans.filter(x => x !== id); renderQuiz(); }
        function qReset() { Q.ans = []; renderQuiz(); }
        function qHint() {
            const cur = Q.ans.map(id => Q.toks[id]); let k = 0;
            while (k < cur.length && cur[k] === Q.toks[k]) k++;
            Q.ans = Q.ans.slice(0, k);
            const id = Q.order.find(x => !Q.ans.includes(x) && Q.toks[x] === Q.toks[k]);
            if (id !== undefined) Q.ans.push(id);
            qCheck(); renderQuiz();
        }
        function renderQuiz() {
            const box = document.getElementById('quizBox'); if (!box) return;
            if (!Q.items.length) { box.innerHTML = '<p>이번 주에는 고칠 문장이 없었어요. 잘했어요! 🎉</p>'; return; }
            const it = Q.items[Q.i], toks = Q.toks;
            const full = Q.ans.length === toks.length;
            const ok = full && Q.ans.map(id => toks[id]).join(' ') === it.now;
            const pool = Q.order.filter(id => !Q.ans.includes(id));
            const solved = Q.items.filter(x => notesDone[x.key]).length;
            const last = Q.i === Q.items.length - 1;
            box.innerHTML = `
                <div class="q-meta">문제 ${Q.i + 1} / ${Q.items.length} · 맞힌 문제 ${solved}</div>
                <div class="q-was">처음엔 이렇게 말했어요 → <span class="was">${esc(it.was)}</span></div>
                <div class="q-ask">단어를 눌러서 바르게 고쳐 말해볼까요?</div>
                <div class="q-ans ${ok ? 'good' : (full ? 'bad' : '')}">${Q.ans.map(id => `<button class="tile" ${ok ? 'disabled' : ''} onclick="qBack(${id})">${esc(toks[id])}</button>`).join('')}</div>
                <div class="q-pool">${pool.map(id => `<button class="tile" onclick="qPick(${id})">${esc(toks[id])}</button>`).join('')}</div>
                ${ok ? '<div class="q-ok">🎉 정답이에요! 이렇게 말하면 더 좋아요</div>' : ''}
                ${full && !ok ? '<div class="q-no">앗, 순서가 조금 달라요. 단어를 눌러 빼고 다시 해봐요!</div>' : ''}
                <div>
                    ${!ok ? '<button class="mini" onclick="qHint()">💡 힌트</button><button class="mini" onclick="qReset()">↺ 다시</button>' : ''}
                    ${ok ? `<button class="mini go" onclick="qStart(${last ? 0 : Q.i + 1})">${last ? '처음부터 다시 ↺' : '다음 문제 ▶'}</button>` : ''}
                </div>`;
        }
        function renderWeekReview() {
            const el = document.getElementById('weekReview');
            const wl = weekLessons();
            if (!wl.length) { el.innerHTML = '<div class="review"><p>아직 수업 기록이 없어요.</p></div>'; return; }
            const range = wl.map(l => dayK(l.date) + ' ' + mdTxt(l.date)).join(' · ');
            el.innerHTML = `<div class="review">
                <h2>🎯 이번 주 복습</h2>
                <div class="sub">${esc(range)} 수업을 한 번에 복습해요</div>
                <div class="step-t"><span>① 이번 주 말 읽어보기</span><small>읽은 문장 <span id="wkCount"></span></small></div>
                ${wl.map(l => `<div class="wk-day">${dayK(l.date)}요일 수업 (${mdTxt(l.date)})</div>` + l.patterns.map((p, j) => {
                    const key = l.date + '-' + j;
                    return `<div class="pat ${notesDone[key] ? 'done' : ''}">
                        <div class="pat-text">${esc(p)}</div>
                        <label class="pat-check"><input type="checkbox" ${notesDone[key] ? 'checked' : ''} data-key="${key}" onchange="toggleNote('${key}', this.checked)">읽었어요</label>
                    </div>`;
                }).join('')).join('')}
                <div class="step-t"><span>② 고친 문장 퀴즈</span></div>
                <div id="quizBox"></div>
            </div>`;
            updateWkCount();
            const items = qItems(), sig = items.map(x => x.key).join('|');
            if (sig !== Q.sig) { Q.sig = sig; Q.items = items; if (items.length) { qStart(0); return; } }
            renderQuiz();
        }

        function render() {
            const morningHtml = routineData.morning.map(createCard).join('');
            const afternoonHtml = routineData.afternoon.map(createCard).join('');
            document.getElementById('morningRoutines').innerHTML = morningHtml;
            document.getElementById('afternoonRoutines').innerHTML = afternoonHtml;
            document.querySelector('.section-header.morning').style.display = morningHtml === '' ? 'none' : 'inline-block';
            document.querySelector('.section-header.afternoon').style.display = afternoonHtml === '' ? 'none' : 'inline-block';
            document.getElementById('saturdayActivities').innerHTML = satItems.map(a => `<button class="activity-btn ${data.weekend.includes(a) ? 'selected' : ''}" onclick="toggleSat('${a}')">${a}</button>`).join('');
            
            document.getElementById('weekendWish').value = data.weekendWish || '';
            if(data.weekly.easy) document.getElementById('weeklyEasy').value = data.weekly.easy;
            if(data.weekly.hard) document.getElementById('weeklyHard').value = data.weekly.hard;
            if(data.weekly.plan) document.getElementById('weeklyPlan').value = data.weekly.plan;
            
            updateBadge();
        }
        render();
    </script>
</body>
</html>
