<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#5e35b1">
    <title>우리 아이 주간 루틴표 (태블릿 버전)</title>
    <style>
        /* 기본 리셋 및 최적화 */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; 
            background: linear-gradient(135deg, #e3f2fd 0%, #e1bee7 100%); 
            min-height: 100vh; 
            padding: 20px; 
            padding-bottom: 60px; 
            color: #333;
        }
        
        /* 태블릿용 메인 컨테이너 */
        .container { max-width: 1024px; margin: 0 auto; position: relative; }

        /* 메인 헤더 카드 */
        .header-card {
            background: white; 
            border-radius: 20px; 
            padding: 20px 24px; 
            margin-bottom: 20px; 
            box-shadow: 0 4px 16px rgba(0,0,0,0.06); 
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header-info h1 { font-size: 26px; color: #333; margin-bottom: 4px; }
        .header-info .subtitle { color: #666; font-size: 15px; }
        
        /* 필터 버튼 */
        .filter-container { display: flex; gap: 8px; }
        .filter-btn { 
            padding: 10px 18px; 
            border: 2px solid #5e35b1; 
            border-radius: 12px; 
            background: white; 
            color: #5e35b1; 
            font-weight: bold; 
            font-size: 15px; 
            cursor: pointer; 
            transition: all 0.2s ease;
        }
        .filter-btn.active { background: #5e35b1; color: white; }

        /* 상단 탭 */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn {
            flex: 1; padding: 14px; border: none; border-radius: 16px;
            background: rgba(255,255,255,0.65); color: #5e35b1;
            font-size: 17px; font-weight: 700; cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }
        .tab-btn.active { background: #5e35b1; color: white; }
        @media (max-width: 480px) { .tab-btn { font-size: 15px; padding: 12px 4px; } }

        /* 완료 표시 안내 (범례) */
        .legend { display: flex; flex-wrap: wrap; gap: 8px 18px; background: white; border-radius: 14px; padding: 12px 18px; margin-bottom: 16px; font-size: 15px; font-weight: 600; color: #444; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
        .lg { display: inline-block; width: 16px; height: 16px; border-radius: 5px; margin-right: 6px; vertical-align: -3px; }
        .lg-ok { background: #2e7d32; }
        .lg-half { background: #ff8f00; border-radius: 50%; }
        .lg-rest { background: #5c6bc0; }

        /* 대시보드 레이아웃 */
        .dashboard-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1.25fr 0.95fr;
                align-items: start;
            }
        }
        
        /* 카드 공통 */
        .card { 
            background: white; 
            border-radius: 20px; 
            padding: 20px; 
            margin-bottom: 16px; 
            box-shadow: 0 4px 16px rgba(0,0,0,0.06); 
        }
        h2 { font-size: 19px; color: #333; margin-bottom: 14px; }
        
        /* 섹션 헤더 */
        .section-header { 
            display: inline-block; 
            padding: 8px 16px; 
            border-radius: 10px; 
            font-weight: 700; 
            font-size: 17px; 
            margin-bottom: 12px; 
            margin-top: 4px; 
        }
        .morning { background: #fff9c4; color: #f57f17; }
        .afternoon { background: #ffe0b2; color: #e65100; }
        
        /* 루틴 카드 및 그룹별 테마 색상 */
        .routine-card { background: #f8f9fa; border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; border: 1px solid #eef0f2; }
        .routine-card.group-talk { background: #ece4fa; border: 1px solid #b39ddb; border-left: 5px solid #7e57c2; }
        .routine-card.group-eng2 { background: #e3f2fd; border: 1px solid #90caf9; border-left: 5px solid #1e88e5; }
        .routine-card.group-eng { background: #e3f2fd; border: 1px solid #90caf9; border-left: 5px solid #1e88e5; }
        .routine-card.group-math { background: #e8f5e9; border: 1px solid #a5d6a7; border-left: 5px solid #43a047; }

        .routine-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
        .routine-emoji { font-size: 26px; }
        .routine-name { font-size: 18px; font-weight: 700; color: #333; }
        .days-note { font-size: 15px; color: #666; font-weight: 600; }
        .effort-guide { font-size: 15px; color: #e65100; font-weight: 600; margin-left: 32px; margin-bottom: 4px; }
        .routine-trigger { font-size: 15px; color: #555; font-style: italic; margin-bottom: 4px; margin-left: 32px; }
        .routine-note { font-size: 15px; color: #444; margin-left: 32px; margin-bottom: 10px; line-height: 1.4; }
        
        /* 요일 버튼 그리드 */
        .days-grid { display: grid; gap: 6px; margin-top: 8px; }
        .days-grid.seven-days { grid-template-columns: repeat(7, 1fr); }
        .days-grid.six-days { grid-template-columns: repeat(6, 1fr); }
        .days-grid.five-days { grid-template-columns: repeat(5, 1fr); }
        .days-grid.four-days { grid-template-columns: repeat(4, 1fr); }
        .days-grid.three-days { grid-template-columns: repeat(3, 1fr); }
        .days-grid.two-days { grid-template-columns: repeat(2, 1fr); }
        
        .day-box { display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .day-label { font-size: 15px; color: #666; font-weight: 600; }
        .day-btn { 
            width: 100%; 
            height: 48px; 
            border: 1.5px solid #dcdfe6; 
            border-radius: 10px; 
            background: white; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            transition: transform 0.1s ease;
            font-size: 13px;
            font-weight: bold;
            padding: 2px;
        }
        .day-btn:active { transform: scale(0.96); }
        .day-btn.checked { background-color: #2e7d32 !important; border-color: #1b5e20 !important; color: white; }
        .day-btn.circle { background-color: #ff8f00 !important; border-color: #ff6f00 !important; color: white; }
        .day-btn.sick { background-color: #5c6bc0 !important; border-color: #3949ab !important; color: white; font-size: 18px; }
        .day-btn.off { background: #eeeeee; border-color: #e0e0e0; color: #9e9e9e; cursor: not-allowed; }
        .day-btn.pass { background: #eceff1; border-color: #cfd8dc; color: #546e7a; cursor: default; }
        
        /* 아침 수학 버튼: 누를 때마다 ✔ → 🌿 → 해제 */
        .math-opt-btn {
            width: 100%;
            min-height: 56px;
            padding: 6px 2px;
            margin-top: 4px;
            border-radius: 10px;
            border: 1.5px solid #a5d6a7;
            background: white;
            color: #2e7d32;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            transition: transform 0.1s ease;
        }
        .math-opt-btn:active { transform: scale(0.96); }
        .math-opt-btn.checked { background: #2e7d32; border-color: #1b5e20; color: #fff; }
        .math-opt-btn.circle { background: #ff8f00; border-color: #ff6f00; color: #fff; }
        .math-opt-btn.sick { background: #5c6bc0; border-color: #3949ab; color: #fff; }
        .math-opt-btn .checkmark { width: 18px; height: 18px; }

        /* 아이콘 */
        .checkmark { width: 20px; height: 20px; stroke: white; stroke-width: 4; fill: none; }
        .circle-icon { width: 14px; height: 14px; border: 3px solid white; border-radius: 50%; }
        
        /* 폭죽 모션 */
        .confetti { position: fixed; width: 8px; height: 8px; z-index: 1001; top: -10px; border-radius: 2px; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(100vh) rotate(720deg); } }
        
        /* 주말 섹션 */
        .weekend-wrapper { display: flex; flex-direction: column; gap: 12px; }
        .activity-btn { 
            width: 100%; 
            padding: 12px 14px; 
            margin-bottom: 8px; 
            border: 1.5px solid #e0e0e0; 
            border-radius: 10px; 
            background: white; 
            text-align: left; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 16px;
            transition: all 0.2s ease;
        }
        .activity-btn.selected { background: #ec407a; color: white; border-color: #ec407a; }

        /* 성장 기록 및 입력창 */
        .badge-container { display: flex; flex-direction: column; align-items: center; padding: 16px; background: #f1f8e9; border-radius: 12px; margin-bottom: 14px; border: 1px dashed #81c784; }
        .badge-icon { font-size: 42px; margin-bottom: 4px; }
        .badge-text { font-size: 16px; font-weight: bold; color: #2e7d32; }
        
        label { font-size: 14px; font-weight: bold; color: #555; display: block; margin-top: 10px; margin-bottom: 4px; }
        input[type="text"] { width: 100%; padding: 12px; border: 1.5px solid #e0e0e0; border-radius: 10px; font-size: 16px; margin-bottom: 6px; }
        input[type="text"]:focus { border-color: #5e35b1; outline: none; }

        /* 버튼 영역 */
        .btn-group { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .save-btn { width: 100%; padding: 13px; background: #4caf50; color: white; border: none; border-radius: 10px; font-weight: 700; font-size: 16px; cursor: pointer; transition: background 0.2s ease; }
        .save-btn:hover { background: #43a047; }
        .email-btn { background: #2196f3; }
        .email-btn:hover { background: #1e88e5; }
        .reset-btn { background: none; border: none; color: #888; text-decoration: underline; font-size: 13px; width: 100%; cursor: pointer; margin-top: 12px; padding: 4px; }
        
        /* 팝업 모달 */
        .popup { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.88); color: white; padding: 18px 28px; border-radius: 24px; display: none; z-index: 2000; text-align: center; font-weight: bold; font-size: 17px; border: 1.5px solid #fff; width: 85%; max-width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); line-height: 1.4; white-space: pre-line; }
        .day-box.is-today .day-label { color: #5e35b1; font-weight: bold; text-decoration: underline; }
        .weekend-math-note { font-size: 13px; color: #5e35b1; font-weight: 700; margin-top: 3px; }

        /* 영어 수업노트: 문장 따라읽기 확인 구조 */
        #notesView { max-width: 680px; margin: 0 auto; }
        .notes-guide-box {
            background: #ede7f6;
            border-left: 5px solid #5e35b1;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 13px;
            color: #4a148c;
            line-height: 1.5;
            font-weight: 600;
        }
        .lesson { background: white; border-radius: 20px; margin-bottom: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); overflow: hidden; }
        .lesson summary { list-style: none; cursor: pointer; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; background: #fafafa; }
        .lesson summary::-webkit-details-marker { display: none; }
        .lesson summary b { font-size: 17px; color: #333; display: block; }
        .lesson summary small { color: #777; font-size: 13px; }
        .lesson-body { padding: 16px 20px 20px; }
        .lesson-book { font-size: 13px; color: #5e35b1; font-weight: bold; margin-bottom: 12px; }
        .lesson-body h3 { font-size: 15px; color: #333; margin: 18px 0 10px; display: flex; align-items: center; gap: 6px; }

        .pat-card {
            background: #f8f9fa;
            border: 1.5px solid #e0e0e0;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }
        .pat-card.done { background: #e8f5e9; border-color: #a5d6a7; }
        .pat-sentence { font-size: 17px; color: #222; line-height: 1.6; margin-bottom: 10px; font-weight: 500; }
        .pat-action-bar { display: flex; justify-content: flex-end; align-items: center; border-top: 1px dashed #e0e0e0; padding-top: 8px; margin-top: 6px; }
        .read-check-btn {
            border: 1px solid #b39ddb;
            background: #fff;
            color: #5e35b1;
            font-weight: 700;
            font-size: 13px;
            border-radius: 10px;
            padding: 7px 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .read-check-btn:hover:not(:disabled) { background: #f3e5f5; }
        .read-check-btn.done { background: #e8f5e9; border-color: #81c784; color: #2e7d32; }

        /* Fixes (교정 문장) 카드 */
        .fix-card { background: #fff3e0; border: 1.5px solid #ffe0b2; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; transition: all 0.2s ease; }
        .fix-card.done { background: #e8f5e9; border-color: #a5d6a7; }
        .fix-was { color: #d84315; font-size: 14px; text-decoration: line-through; margin-bottom: 4px; }
        .fix-now { color: #2e7d32; font-weight: 700; font-size: 16px; line-height: 1.5; margin-bottom: 8px; }
        .fix-action-bar { display: flex; justify-content: flex-end; border-top: 1px dashed #ffe0b2; padding-top: 8px; margin-top: 6px; }
        .fix-card.done .fix-action-bar { border-top-color: #a5d6a7; }
    </style>
</head>
<body>
    <div id="popup" class="popup"></div>
    
    <div class="container">
        <!-- 상단 헤더 -->
        <div class="header-card">
            <div class="header-info">
                <h1>⭐ 우리 아이 주간 루틴표</h1>
                <div class="subtitle">"오늘의 작은 발걸음이 내일의 큰 꿈이 될 거야!"</div>
            </div>
            <div class="filter-container" id="filterBox">
                <button id="viewAll" class="filter-btn active" onclick="setFilter('all')">전체 루틴</button>
                <button id="viewToday" class="filter-btn" onclick="setFilter('today')">오늘만 집중</button>
            </div>
        </div>

        <!-- 상단 탭 버튼 -->
        <div class="tabs">
            <button id="tabRoutine" class="tab-btn active" onclick="showTab('routine')">📅 루틴표</button>
            <button id="tabNotes" class="tab-btn" onclick="showTab('notes')">📖 영어 수업노트</button>
        </div>

        <!-- 루틴표 화면 -->
        <div id="routineView">
            <!-- 완료 표시 안내 -->
            <div class="legend">
                <span><i class="lg lg-ok"></i>다 했어요</span>
                <span><i class="lg lg-half"></i>10분만 해도 OK!</span>
                <span><i class="lg lg-rest"></i>쉬는 날</span>
            </div>
            <div class="dashboard-grid">
                <!-- 좌측: 아침 & 오후 루틴 -->
                <div id="routineContainer">
                    <div class="section-header morning">🌅 아침 루틴</div>
                    <div id="morningRoutines"></div>
                    
                    <div class="section-header afternoon">☀️ 오후 루틴</div>
                    <div id="afternoonRoutines"></div>
                </div>

                <!-- 우측: 주말 활동 & 성찰 기록 -->
                <div class="right-sidebar">
                    <div class="weekend-wrapper" id="weekendSection">
                        <div class="card" style="border-left: 5px solid #ec407a;">
                            <h2>✨ 주말 특별 활동</h2>
                            <div id="saturdayActivities"></div>
                            <label for="weekendWish">💭 우리 아이 희망사항</label>
                            <input type="text" id="weekendWish" placeholder="예: 키즈카페 가고 싶어요" oninput="data.weekendWish = this.value; save();">
                        </div>
                    </div>

                    <div class="card" style="border-left: 5px solid #4caf50;">
                        <h2>💭 이번 주 성장 기록</h2>
                        <div class="badge-container" id="badgeArea">
                            <div class="badge-icon" id="badgeIcon">🌱</div>
                            <div class="badge-text" id="badgeText">씨앗이 심어졌어!</div>
                        </div>
                        <label>제일 쉬웠던 것:</label>
                        <input type="text" id="weeklyEasy" placeholder="예: 아침 집중듣기">
                        
                        <label>힘들었던 것:</label>
                        <input type="text" id="weeklyHard" placeholder="예: 한자 공부하기">
                        
                        <label>다음 주 작전:</label>
                        <input type="text" id="weeklyPlan" placeholder="예: 아침 수학 집중해서 하기!">
                        
                        <div class="btn-group">
                            <button class="save-btn" onclick="saveReflection()">기록 저장하기</button>
                            <button class="save-btn email-btn" onclick="sendWeeklyEmail()">📧 기록 메일 보내기</button>
                        </div>
                        <button class="reset-btn" onclick="manualResetRoutines()">🔄 새로운 주 시작 (전체 초기화)</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 영어 수업노트 화면 -->
        <div id="notesView" style="display:none">
            <div class="notes-guide-box">
                🗣️ <b>배운 문장 따라읽기</b><br>
                문장을 보면서 소리 내어 2번 읽어 보세요. 문장을 외우거나 빈칸을 떠올릴 필요는 없어요.
            </div>
            <div id="lessonList"></div>
        </div>

    </div>

    <script>
        const weekdayList = ['월', '화', '수', '목', '금'];
        const fullWeekList = ['월', '화', '수', '목', '금', '토', '일'];
        const sixDayList = ['월', '화', '수', '목', '금', '주말'];
        const MATH_PM_OFF = ['화', '목', '토', '일']; /* 화·목은 오후 수학을 쉬고, 주말은 오전 2p만으로 완료 */

        const todayIdx = (new Date().getDay() + 6) % 7;
        const todayName = fullWeekList[todayIdx];
        const todayLabel = todayIdx >= 5 ? '주말' : todayName;

        const routineData = {
            morning: [
                { id: 'english_morning', group: 'eng', name: '오전 영어 집중듣기 (30분)', emoji: '🎧', trigger: '07:00 ~ 07:30 맑은 정신으로!', effort: '음원과 눈으로 편안하게 따라 읽기', daysNote: '토·일 각각 오전/오후 중 1회', weekendEnabled: true, allowSick: true },
                { id: 'english_read_along_morning', group: 'eng', name: '오전 1권 따라 읽기 (Read-Along)', emoji: '🗣️', trigger: '집중듣기 한 책 중 1권 골라서!', effort: '소리 내어 자신 있게 읽으면 성공!', allowSick: true },
                { id: 'math_morning', group: 'math', name: '아침 수학 공부', emoji: '🔢', trigger: '07:30 ~ 08:00', instruction: '평일은 2p 또는 4p까지 선택해요. 토·일은 2p만 해도 하루 수학 완료!', isMathMorning: true, weekendEnabled: true, allowSick: true }
            ],
            afternoon: [
                { id: 'math_afternoon', group: 'math', name: '오후 수학 이어서 하기 (2페이지)', emoji: '🧩', trigger: '월/수 하교 후(태권도 전) 또는 저녁 시간', instruction: '오전에 2p까지 했을 때 이어서 마무리해요. 토·일은 쉬어요.', offDays: MATH_PM_OFF, daysNote: '화·목·토·일은 쉬어요', isMathAfternoon: true, weekendEnabled: true, allowSick: true },
                { id: 'talkstation_prep', group: 'talk', name: '화상영어 5분 사전 복습', emoji: '📓', trigger: '월/수 오후 2:20 (수업 10분 전)', instruction: '지난 수업 노트 문장 2번 읽고 뇌 워밍업!', customDays: ['월', '수'], daysNote: '월/수 2:20', allowSick: true },
                { id: 'english_afternoon', group: 'eng', name: '오후 영어 집중듣기 (30분)', emoji: '🎧', trigger: '태권도 다녀와서, 저녁 식사 전/후', daysNote: '토·일 각각 오전/오후 중 1회', weekendEnabled: true, allowSick: true },

        function createConfetti() {

        /* 주말 집중듣기: 토요일과 일요일을 각각 독립해서 기록하고, 각 날짜는 오전/오후 중 한 번만 하면 완료 */
        const ENG_WEEKEND = {
            english_morning: ['english_afternoon', '오후 완료'],
            english_afternoon: ['english_morning', '오전 완료']
        };
        function weekendPassLabel(id, d, state) {
            const m = ENG_WEEKEND[id];
            if (!m || !['토', '일'].includes(d) || state !== 'empty') return null;
            const o = data.routines[m[0] + '-' + d];
            return (o === 'checked' || o === 'circle') ? m[1] : null;
        }

        /* 집계: 수학은 오전/오후 칸을 따로 세지 않고 '하루 1개'로 계산
           - 오전에 모두 마친 날(math_4p) → 완료 1개
           - 오전 일부(math_2p) + 오후 칸 체크 → 오후 칸 상태로 1개
           - 오전 일부만 있고 오후 미완료 → 아직 0개 */
        function getStats() {
            const s = { green: 0, yellow: 0, sick: 0 };
            const add = v => { if (v === 'checked') s.green++; else if (v === 'circle') s.yellow++; else if (v === 'sick') s.sick++; };
            Object.entries(data.routines).forEach(([k, v]) => {
                const isWeekendEnglish = /^(english_morning|english_afternoon)-(토|일)$/.test(k);
                if (!k.startsWith('math_morning-') && !k.startsWith('math_afternoon-') && !isWeekendEnglish) add(v);
            });
            /* 토요일과 일요일은 각각 오전/오후를 합쳐 하루 1개로 계산 */
            const rank = { checked: 3, circle: 2, sick: 1 };
            ['토', '일'].forEach(d => {
                const we = [data.routines['english_morning-' + d], data.routines['english_afternoon-' + d]]
                    .filter(v => rank[v]).sort((a, b) => rank[b] - rank[a]);
                if (we.length) add(we[0]);
            });
            /* 수학: 하루 1개 (월~일). 쉬는 날(🌿)이면 쉬는 날 1개 */
            fullWeekList.forEach(d => {
                const m = parseMath(data.routines['math_morning-' + d]);
                const a = data.routines['math_afternoon-' + d];
                if (m && m.mark === 'sick') add('sick');
                else if (MATH_PM_OFF.includes(d)) add(m ? m.mark : null);
                else if (m && m.mark === 'checked' && m.amt === 4) add('checked');
                else if (m && m.mark === 'circle') add(a === 'checked' ? 'checked' : 'circle');
                else add(a);
            });
            return s;
        }

        /* 아침 수학 선택 로직 */
        /* 아침 수학 상태 값: 'math_2p' / 'math_4p' (다 했어요), '..._circle' (10분만 해도 OK), '..._sick' (쉬는 날) */
        function parseMath(v) {
            if (!v) return null;
            if (v === 'sick') return { amt: null, mark: 'sick' };
            if (v === 'math_circle') return { amt: null, mark: 'circle' };
            const m = /^math_(2|4)p(_circle|_sick)?$/.exec(v);
            if (!m) return null;
            return { amt: Number(m[1]), mark: m[2] === '_circle' ? 'circle' : (m[2] === '_sick' ? 'sick' : 'checked') };
        }
        function mathPassLabel(d) {
            const m = parseMath(data.routines['math_morning-' + d]);
            if (!m) return null;
            if (m.mark === 'sick') return '쉬는 날';
            if (m.amt === 4 && m.mark === 'checked') return '오전 완료';
            return null;
        }

        /* 2p/4p 버튼을 누를 때마다: 다 했어요(✔) → 쉬는 날(🌿) → 해제 (아침 수학은 동그라미 없음) */
        function selectMathMorning(d, amt) {
            const morningKey = 'math_morning-' + d;
            const afternoonKey = 'math_afternoon-' + d;
            const cur = parseMath(data.routines[morningKey]);
            const noAfternoon = MATH_PM_OFF.includes(d);
            let mark = 'checked';
            if (cur && cur.amt === amt) mark = cur.mark === 'sick' ? null : 'sick';

            if (!mark) {
                delete data.routines[morningKey];
                showPopup("선택을 취소했어요.");
            } else {
                data.routines[morningKey] = 'math_' + amt + 'p' + (mark === 'checked' ? '' : '_' + mark);
                if (mark === 'sick' || (mark === 'checked' && amt === 4)) delete data.routines[afternoonKey];
                if (mark === 'sick') showPopup(sickMsg[Math.floor(Math.random() * sickMsg.length)]);
                else if (amt === 2) showPopup(noAfternoon ? "2p까지 했어요." : "2p까지 했어요.\n나머지는 오후에 이어서 해요.");
                else showPopup(noAfternoon ? "4p까지 했어요." : "오전에 모두 마쳤어요.\n오후 수학은 건너뛰어도 돼요.");
            }
            save(); render();
        }

        /* 일반 루틴 토글 */
        function toggle(id, d, allowSick) {
            const key = id + '-' + d;
            const s = data.routines[key] || 'empty';
            
            if (s === 'empty') data.routines[key] = 'checked';
            else if (s === 'checked') data.routines[key] = 'circle';
            else if (s === 'circle' && allowSick) data.routines[key] = 'sick';
            else data.routines[key] = 'empty';
            
            const now = data.routines[key];
            if (now !== 'empty') {
                createConfetti();
                let msg = "";
                if (now === 'sick') {
                    msg = sickMsg[Math.floor(Math.random() * sickMsg.length)];
                } else if (now === 'circle') {
                    msg = circleMsgs[Math.floor(Math.random() * circleMsgs.length)];
                } else if (id === 'math_afternoon') {
                    msg = "오후에 이어서 마무리했어요! 👏";
                } else {
                    let msgs = id.includes('reading') ? readingMsgs : normalMsgs;
                    msg = msgs[Math.floor(Math.random() * msgs.length)];
                }
                showPopup(msg);
            }
            save(); render();
        }

        function createCard(r) {
            let days = r.customDays ? r.customDays : (r.weekendEnabled ? fullWeekList : (r.isSixDay ? sixDayList : weekdayList));
            let currentCheckLabel = r.weekendEnabled ? todayName : (r.isSixDay ? todayLabel : todayName);
            if (currentFilter === 'today' && !(r.activeDays || days).includes(currentCheckLabel)) return '';
            if (currentFilter === 'today' && r.offDays && r.offDays.includes(currentCheckLabel)) return '';
            
            let dHtml = '';
            let displayDays = (currentFilter === 'today' && !r.activeDays) ? [currentCheckLabel] : days;

            displayDays.forEach((d) => {
                if (r.offDays && r.offDays.includes(d)) {
                    dHtml += `<div class="day-box ${d === currentCheckLabel ? 'is-today' : ''}">
                        <div class="day-label">${d}</div>
                        <button class="day-btn off" disabled>OFF</button>
                    </div>`;
                    return;
                }
                const key = r.id + '-' + d;
                const state = data.routines[key] || 'empty';
                const passLabel = weekendPassLabel(r.id, d, state);
                
                if (r.isMathMorning) {
                    const isWeekendMath = (d === '토' || d === '일');
                    const mm = parseMath(state);
                    const symbol = mark => mark === 'checked' ? '<svg class="checkmark" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>' : (mark === 'circle' ? '<div class="circle-icon"></div>' : (mark === 'sick' ? '🌿' : ''));
                    const mathBtn = amt => {
                        const on = mm && mm.amt === amt;
                        return `<button class="math-opt-btn ${on ? mm.mark : ''}" onclick="selectMathMorning('${d}', ${amt})"><span>${amt}p까지</span>${on ? symbol(mm.mark) : ''}</button>`;
                    };
                    dHtml += `<div class="day-box ${d === currentCheckLabel ? 'is-today' : ''}">
                        <div class="day-label">${d}</div>
                        ${mathBtn(2)}
                        ${isWeekendMath ? '<div class="weekend-math-note">2p면 완료</div>' : mathBtn(4)}
                    </div>`;
                } else if (passLabel) {
                    dHtml += `<div class="day-box ${d === currentCheckLabel ? 'is-today' : ''}">
                        <div class="day-label">${d}</div>
                        <button class="day-btn pass" disabled>${passLabel}</button>
                    </div>`;
                } else if (r.id === 'math_afternoon' && mathPassLabel(d)) {
                    dHtml += `<div class="day-box ${d === currentCheckLabel ? 'is-today' : ''}">
                        <div class="day-label">${d}</div>
                        <button class="day-btn pass" disabled>${mathPassLabel(d)}</button>
                    </div>`;
                } else {
                    dHtml += `<div class="day-box ${d === currentCheckLabel ? 'is-today' : ''}">
                        <div class="day-label">${d}</div>
                        <button class="day-btn ${state}" onclick="toggle('${r.id}','${d}',${r.allowSick})">
                            ${state === 'checked' ? '<svg class="checkmark" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>' : state === 'circle' ? '<div class="circle-icon"></div>' : state === 'sick' ? '🌿' : ''}
                        </button>
                    </div>`;
                }
            });

            let gridClass = (currentFilter === 'today' && !r.activeDays) ? '' : (days.length === 7 ? 'seven-days' : (days.length === 6 ? 'six-days' : (days.length === 4 ? 'four-days' : (days.length === 3 ? 'three-days' : (days.length === 2 ? 'two-days' : 'five-days')))));

            return `<div class="routine-card ${r.group ? 'group-' + r.group : ''}">
                <div class="routine-header">
                    <span class="routine-emoji">${r.emoji}</span>
                    <span class="routine-name">${r.name}</span>${r.daysNote ? `<span class="days-note">${r.daysNote}</span>` : ''}
                </div>
                ${r.effort ? `<div class="effort-guide">⭕ ${r.effort}</div>` : ''}
                ${r.trigger ? `<div class="routine-trigger">⏰ ${r.trigger}</div>` : ''}
                ${r.instruction ? `<div class="routine-note">💡 ${r.instruction}</div>` : ''}
                <div class="days-grid ${gridClass}">${dHtml}</div>
            </div>`;
        }

            }).join('');

        /* 이번 주 집계 가능한 최대 개수 (루틴 구성이 바뀌어도 자동 계산)
           - 수학: 월~일 하루 1개 / 주말 집중듣기: 토·일 각각 오전·오후를 합쳐 1개 */
        function getMaxCount() {
            let total = fullWeekList.length + 2;
            [...routineData.morning, ...routineData.afternoon].forEach(r => {
                if (r.id.startsWith('math_')) return;
                const days = r.customDays ? r.customDays : (r.weekendEnabled ? fullWeekList : (r.isSixDay ? sixDayList : weekdayList));
                let cells = days.filter(d => !(r.offDays && r.offDays.includes(d)));
                if (ENG_WEEKEND[r.id]) cells = cells.filter(d => d !== '토' && d !== '일');
                total += cells.length;
            });
            return total;
        }

        /* 배지 기준: '다 했어요'+'10분만 해도 OK' 개수 ÷ (전체 − 쉬는 날)
           1개 이상 → 새싹 / 30% 이상 → 나무 / 70% 이상 → 황금 열매 */
        function updateBadge() {
            const st = getStats();
            const done = st.green + st.yellow;
            const possible = Math.max(getMaxCount() - st.sick, 1);
            const ratio = done / possible;
            const icon = document.getElementById('badgeIcon'); const text = document.getElementById('badgeText');
            if (done === 0) { icon.textContent = '🌱'; text.textContent = '씨앗이 심어졌어!'; }
            else if (ratio < 0.3) { icon.textContent = '🌿'; text.textContent = '새싹이 올라왔어! 대단해!'; }
            else if (ratio < 0.7) { icon.textContent = '🌳'; text.textContent = '우와, 튼튼한 나무가 되었어!'; }
            else { icon.textContent = '🍎'; text.textContent = '축하해! 황금 열매가 열렸어!'; }
        }

            window.location.href = `mailto:?subject=[루틴표] 이번 주 기록&body=${encodeURIComponent(body)}`;
        }

        function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
        
        /* 문장별 따라읽기 횟수 기록
           0 → 1 → 2(완료) → 다시 누르면 0으로 초기화
           전체를 다시 그리지 않고 눌린 버튼과 카드만 갱신해서, 열려 있는 수업노트가 닫히지 않게 함 */
        function readBtnLabel(count) {
            return count >= 2 ? '✅ 2회 완료' : `🔊 따라읽기 ${count}/2회`;
        }
        function incrementReadCount(key, btn) {
            const current = Number(notesReadCount[key] || 0);
            const next = current >= 2 ? 0 : current + 1;
            if (next === 0) delete notesReadCount[key];
            else notesReadCount[key] = next;
            localStorage.setItem('notesReadCount', JSON.stringify(notesReadCount));

            const done = next >= 2;
            btn.classList.toggle('done', done);
            btn.textContent = readBtnLabel(next);

            const card = btn.closest('.pat-card, .fix-card');
            if (card) card.classList.toggle('done', done);
        }

        /* 수업노트 열림/닫힘 상태 기억 (날짜별) */

        /* 영어 수업노트 렌더링 함수 */

                        <span><b>${esc(l.label)}</b><small>Teacher ${esc(l.teacher)} · ${esc(l.time)}</small></span>

                    <div class="lesson-body">
                        <div class="lesson-book">📖 ${esc(l.book)}</div>
                        
                        <h3>🗣️ 오늘 배운 말</h3>
                        ${l.patterns.map((p, j) => {
                            const key = l.date + '-pat-' + j;
                            const count = Math.min(2, Number(notesReadCount[key] || 0));
                            const isDone = count >= 2;
                            return `<div class="pat-card ${isDone ? 'done' : ''}">
                                <div class="pat-sentence">${esc(p.prefix)}${esc(p.target)}</div>
                                <div class="pat-action-bar">
                                    <button class="read-check-btn ${isDone ? 'done' : ''}" onclick="incrementReadCount('${key}', this)">${readBtnLabel(count)}</button>
                                </div>
                            </div>`;
                        }).join('')}

                        <h3>✏️ 이렇게 고치면 더 좋아요</h3>
                        ${l.fixes.map((f, k) => {
                            const key = l.date + '-fix-' + k;
                            const count = Math.min(2, Number(notesReadCount[key] || 0));
                            const isDone = count >= 2;
                            return `<div class="fix-card ${isDone ? 'done' : ''}">
                                <div class="fix-was">❌ ${esc(f.was)}</div>
                                <div class="fix-now">⭕ ${esc(f.prefix)}${esc(f.target)}</div>
                                <div class="fix-action-bar">
                                    <button class="read-check-btn ${isDone ? 'done' : ''}" onclick="incrementReadCount('${key}', this)">${readBtnLabel(count)}</button>
                                </div>
                            </div>`;
                        }).join('')}
                    </div>
                </details>`;
            }).join('');

            /* 사용자가 열고 닫은 상태를 저장 (toggle 이벤트는 버블링되지 않아 각각 연결) */
            document.querySelectorAll('#lessonList details.lesson').forEach(el => {
                el.addEventListener('toggle', () => { lessonOpenState[el.dataset.date] = el.open; });
            });
        }

        // 초기 실행
        render();
    </script>
</body>
</html>
